# Builds the app for both CPUs and runs the tests on every push to main and every pull request.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Get FFmpeg (the decoder tests load it)
        shell: pwsh
        run: ./tools/Get-FFmpeg.ps1 -Arch x64
      - name: Run tests
        run: dotnet test tests/WinMuse.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  build:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The build downloads FFmpeg for the CPU it targets (see EnsureFFmpeg in WinMuse.csproj).
      - name: Build
        run: dotnet build src/WinMuse/WinMuse.csproj -c Release -p:Platform=${{ matrix.platform }} -p:ContinuousIntegrationBuild=true -warnaserror
